# nginx server blocks for hiraeth.systems (HSOS), as installed on the VPS.
# Lives at /etc/nginx/sites-available/hiraeth.systems.conf, symlinked into sites-enabled.
# Separate from the Ghost (hiraeth.club) config and must never be merged into it.
#
# The certificate is issued by certbot with the webroot method (it never edits this file):
#   sudo certbot certonly --webroot -w /var/www/hiraeth.systems \
#     -d hiraeth.systems -d www.hiraeth.systems --cert-name hiraeth.systems \
#     --deploy-hook "systemctl reload nginx"
# certbot.timer renews it; the deploy hook reloads nginx afterwards.
# hiraeth.systems.stage1-http.conf is the HTTP only fallback, if this ever needs rolling back.

server {
    listen 80;
    listen [::]:80;
    server_name hiraeth.systems www.hiraeth.systems;

    # certbot's challenge files, for renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hiraeth.systems;
    }

    location / {
        return 301 https://hiraeth.systems$request_uri;
    }
}

server {
    # Ubuntu 22.04's nginx (1.18) uses the older "listen ... ssl http2" form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hiraeth.systems www.hiraeth.systems;

    ssl_certificate     /etc/letsencrypt/live/hiraeth.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiraeth.systems/privkey.pem;

    if ($host = www.hiraeth.systems) { return 301 https://hiraeth.systems$request_uri; }

    root /var/www/hiraeth.systems;
    index index.html;

    # Note: an add_header inside a location replaces these, so locations repeat them.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static Astro output: try the file, then a directory index, then 404.
    # Pages, screenshots and version.txt: browsers may keep a copy but must check it with the
    # server (ETag, a 304 when unchanged) before using it, so a deploy shows up straight away.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Long cache for hashed build assets.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    error_page 404 /404.html;
}
