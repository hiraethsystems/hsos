# nginx server blocks for hiraeth.systems (HSOS).
# Install as /etc/nginx/sites-available/hiraeth.systems.conf and symlink into sites-enabled.
# This file is separate from the Ghost (hiraeth.club) config and must not be merged into it.
#
# Step 1: enable ONLY the port 80 block (comment out the 443 block), reload nginx,
#         then issue the certificate using the webroot below.
# Step 2: fill in the certificate paths, uncomment the 443 block, test, reload.

server {
    listen 80;
    listen [::]:80;
    server_name hiraeth.systems www.hiraeth.systems;

    # Used by the certificate tool for its challenge files.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hiraeth.systems;
    }

    location / {
        return 301 https://hiraeth.systems$request_uri;
    }
}

