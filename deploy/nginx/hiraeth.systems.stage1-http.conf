# HSOS (hiraeth.systems), stage 1: plain HTTP until the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name hiraeth.systems www.hiraeth.systems;
    root /var/www/hiraeth.systems;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/hiraeth.systems; }
    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /404.html;
}
